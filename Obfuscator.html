<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lua Obfuscator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f14, #151522);
            color: #eaeaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 90%;
            max-width: 1100px;
            background: rgba(20, 20, 30, 0.9);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        header span {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .editor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel label {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        textarea {
            resize: none;
            width: 100%;
            height: 350px;
            background: #0e0e16;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px;
            color: #eaeaf0;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            outline: none;
        }

        textarea::placeholder {
            opacity: 0.4;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .options {
            display: flex;
            gap: 14px;
        }

        .options button {
            background: #1c1c2b;
            border: 1px solid rgba(255,255,255,0.08);
            color: #eaeaf0;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s ease;
        }

        .options button:hover {
            background: #232338;
        }

        .action button {
            background: linear-gradient(135deg, #6b5cff, #8a7dff);
            border: none;
            color: white;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 30px rgba(107,92,255,0.35);
        }

        .action button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 36px rgba(107,92,255,0.45);
        }

        footer {
            margin-top: 14px;
            text-align: right;
            font-size: 0.75rem;
            opacity: 0.4;
        }

        @media (max-width: 900px) {
            .editor {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <header>
            <h1>Lua Obfuscator</h1>
            <span>Roblox • Client-side</span>
        </header>

        <div class="editor">
            <div class="panel">
                <label>Input Lua Script</label>
                <textarea placeholder="-- Paste your Roblox Lua script here"></textarea>
            </div>

            <div class="panel">
                <label>Obfuscated Output</label>
                <textarea placeholder="-- Obfuscated code will appear here" readonly></textarea>
            </div>
        </div>

        <div class="controls">
            <div class="options">
                <button>Rename Variables</button>
                <button>String Encoding</button>
                <button>Control Flow</button>
            </div>

            <div class="action">
                <button>Obfuscate</button>
            </div>
        </div>

        <footer>
            Lua Obfuscator UI — JS coming next
        </footer>
    </div>

</body>
</html>
